<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Login - Yatra Lok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>Yatra Lok</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="tourist_login.html">Login</a></li>
                <li><a href="tourist_signup.html" class="btn-primary">Sign Up</a></li>
            </ul>
            <div class="navbar-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <span class="theme-toggle-icon">🌙</span>
                </button>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>

        <!-- Login Form Section -->
        <section class="form-section">
            <div class="form-container">
                <div class="glass-card form-card">
                    <h2 class="form-title">Welcome Back</h2>
                    <p class="form-subtitle">Login to your Yatra Lok account</p>
                    
                    <form class="login-form" id="loginForm">
                        <!-- Digital ID -->
                        <div class="form-group">
                            <label for="digitalID">Digital ID <span class="required">*</span></label>
                            <input 
                                type="text" 
                                id="digitalID" 
                                name="digitalID" 
                                required 
                                placeholder="Enter your Digital ID (e.g., YT12345)"
                                autocomplete="off"
                            >
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                required 
                                placeholder="Enter your email address"
                            >
                        </div>

                        <!-- Submit Button -->
                        <div class="form-actions">
                            <button type="submit" class="btn-neon btn-primary btn-submit">Login</button>
                            <p class="form-footer-text">
                                Don't have an account? <a href="tourist_signup.html">Sign up here</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
