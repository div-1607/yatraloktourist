<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Sign Up - Yatra Lok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>Yatra Lok</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="tourist_login.html">Login</a></li>
                <li><a href="tourist_signup.html" class="btn-primary">Sign Up</a></li>
            </ul>
            <div class="navbar-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <span class="theme-toggle-icon">🌙</span>
                </button>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>

        <!-- Sign Up Form Section -->
        <section class="form-section">
            <div class="form-container">
                <div class="glass-card form-card">
                    <h2 class="form-title">Create Your Account</h2>
                    <p class="form-subtitle">Join Yatra Lok and start exploring amazing destinations</p>
                    
                    <form class="signup-form" id="signupForm">
                        <!-- Name -->
                        <div class="form-group">
                            <label for="name">Name <span class="required">*</span></label>
                            <input type="text" id="name" name="name" required placeholder="Enter your full name">
                        </div>

                        <!-- Age and Gender Row -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="age">Age <span class="required">*</span></label>
                                <input type="number" id="age" name="age" required placeholder="Enter your age" min="1" max="120">
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender <span class="required">*</span></label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <option value="prefer-not-to-say">Prefer not to say</option>
                                </select>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email" required placeholder="Enter your email address">
                        </div>

                        <!-- Mobile -->
                        <div class="form-group">
                            <label for="mobile">Mobile <span class="required">*</span></label>
                            <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number">
                        </div>

                        <!-- City -->
                        <div class="form-group">
                            <label for="city">City <span class="required">*</span></label>
                            <input type="text" id="city" name="city" required placeholder="Enter your city">
                        </div>

                        <!-- Address -->
                        <div class="form-group">
                            <label for="address">Address <span class="required">*</span></label>
                            <textarea id="address" name="address" required placeholder="Enter your complete address" rows="3"></textarea>
                        </div>

                        <!-- Guardian Section -->
                        <div class="form-divider">
                            <span>Guardian Information (Optional)</span>
                        </div>

                        <!-- Guardian Name -->
                        <div class="form-group">
                            <label for="guardianName">Guardian Name</label>
                            <input type="text" id="guardianName" name="guardianName" placeholder="Enter guardian's name">
                        </div>

                        <!-- Guardian Number -->
                        <div class="form-group">
                            <label for="guardianNumber">Guardian Number</label>
                            <input type="tel" id="guardianNumber" name="guardianNumber" placeholder="Enter guardian's mobile number">
                        </div>

                        <!-- Submit Button -->
                        <div class="form-actions">
                            <button type="submit" class="btn-neon btn-primary btn-submit">Sign Up</button>
                            <p class="form-footer-text">
                                Already have an account? <a href="tourist_login.html">Login here</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
